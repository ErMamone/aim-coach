name: CI

# Gate en el server (además del pre-push local de husky): lint + typecheck + tests + build en cada push/PR.
# No corre build:native (dotnet): el build de webpack no necesita el exe (noErrorOnMissing) para validar el TS.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify
