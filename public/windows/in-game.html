<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aim Coach overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    /* el tamaño de la VENTANA lo define el background (% de pantalla); el texto escala por font-size */
    #wrap { box-sizing: border-box; height: 100vh; padding: 10px; display: flex; flex-direction: column;
      gap: 7px; font-size: calc(13.5px * var(--scale, 1)); }

    #badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16, 18, 24, .82); border: 1px solid rgba(255, 255, 255, .08); color: #c8ccd8;
      font-size: 0.72em; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 20px; }
    #badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff4655; }

    #cal { display: none; background: rgba(91, 140, 255, .96); color: #fff; font-weight: 600;
      font-size: 1.08em; padding: 11px 14px; border-radius: 10px; text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45); }
    #cal.show { display: block; }

    #flick { display: none; align-self: flex-start; font-size: 0.86em; font-weight: 600;
      padding: 4px 12px; border-radius: 20px; color: #12141a; }
    #flick.show { display: inline-block; }
    #flick.flojo { background: #f0c43c; }
    #flick.perfecto { background: #3ecf8e; }
    #flick.pasado { background: #ff6b6b; color: #fff; }
    #flick.lento { background: #7a8296; color: #fff; }

    /* dashboard: una fila por tipo; los más recientes arriba, scrollea si hay muchos */
    #items { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; }
    #items::-webkit-scrollbar { width: 5px; }
    #items::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 3px; }

    .fb { position: relative; background: rgba(18, 20, 27, .90); border: 1px solid rgba(255, 255, 255, .07);
      border-left: 3px solid #5b8cff; color: #e7e9ef; border-radius: 9px; padding: 9px 12px;
      font-size: 0.92em; line-height: 1.4; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); word-wrap: break-word; }
    .fb.good { border-left-color: #2ed3b7; }
    /* crit = urgente (macro/ban, cambio de sens): rojo Valorant + tinte para que salte a la vista */
    .fb.crit { border-left-color: #ff4655; background: rgba(42, 20, 24, .93); }

    /* contador ×N = veces que salió ese tipo de feedback en la sesión */
    .fb .badge { float: right; margin-left: 8px; background: rgba(255, 255, 255, .12); color: #c8ccd8;
      border-radius: 20px; padding: 1px 8px; font-size: 0.8em; font-weight: 600; }
    .fb.good .badge { background: rgba(46, 211, 183, .2); color: #a9efe1; }
    .fb.crit .badge { background: rgba(255, 70, 85, .22); color: #ffc4c9; }

    /* flash breve cuando una fila del mismo tipo se actualiza */
    .fb.flash { animation: fbflash .5s ease-out; }
    @keyframes fbflash { 0% { background: rgba(91, 140, 255, .42); } 100% { background: rgba(18, 20, 27, .90); } }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="badge">Aim Coach</div>
    <div id="cal"></div>
    <div id="flick"></div>
    <div id="items"></div>
  </div>
</body>
</html>
