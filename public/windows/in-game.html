<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aim Coach overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: system-ui, 'Segoe UI', sans-serif; }
    #wrap { padding: 10px; transform: scale(var(--scale, 1)); transform-origin: top left; }
    #flick {
      display: none; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px;
      margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.4); color: #12141a;
    }
    #flick.show { display: inline-block; }
    #flick.flojo { background: #f0c43c; }
    #flick.perfecto { background: #3ecf8e; }
    #flick.pasado { background: #ff6b6b; color: #fff; }
    #badge {
      display: inline-block; background: rgba(91, 140, 255, .92); color: #fff;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .4); margin-bottom: 8px;
    }
    .fb {
      background: rgba(18, 20, 26, .92); border-left: 3px solid #5b8cff; color: #e6e8ec;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.35;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4); opacity: 0; transform: translateY(-6px);
      transition: opacity .25s, transform .25s;
    }
    .fb.show { opacity: 1; transform: none; }
    .fb.good { border-left-color: #3ecf8e; }
    #cal {
      display: none; background: rgba(91, 140, 255, .95); color: #fff;
      font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5); margin-bottom: 8px; text-align: center;
    }
    #cal.show { display: block; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="badge">Aim Coach · overlay (in-game)</div>
    <div id="cal"></div>
    <div id="flick"></div>
  </div>
</body>
</html>
