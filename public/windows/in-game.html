<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aim Coach overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: system-ui, 'Segoe UI', sans-serif; }
    /* el tamaño de la VENTANA lo define el background (% de pantalla); el texto escala por font-size */
    #wrap { box-sizing: border-box; height: 100vh; padding: 10px; display: flex; flex-direction: column;
      font-size: calc(14px * var(--scale, 1)); }
    #badge { align-self: flex-start; background: rgba(91, 140, 255, .92); color: #fff;
      font-size: 0.78em; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    #cal { display: none; background: rgba(91, 140, 255, .95); color: #fff; font-weight: 700;
      font-size: 1.1em; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); }
    #cal.show { display: block; }
    #flick { display: none; align-self: flex-start; font-size: 0.92em; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; color: #12141a; }
    #flick.show { display: inline-block; }
    #flick.flojo { background: #f0c43c; }
    #flick.perfecto { background: #3ecf8e; }
    #flick.pasado { background: #ff6b6b; color: #fff; }
    /* lista de errores: ocupa el resto y scrollea si hay muchos (se ven los ultimos arriba) */
    #items { flex: 1; min-height: 0; overflow-y: auto; }
    #items::-webkit-scrollbar { width: 6px; }
    #items::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 3px; }
    .fb { background: rgba(18, 20, 26, .92); border-left: 3px solid #5b8cff; color: #e6e8ec;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.92em; line-height: 1.35;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4); word-wrap: break-word; }
    .fb.good { border-left-color: #3ecf8e; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="badge">Aim Coach · overlay (in-game)</div>
    <div id="cal"></div>
    <div id="flick"></div>
    <div id="items"></div>
  </div>
</body>
</html>
