<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Aim Coach</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, 'Segoe UI', sans-serif;
      background: #12141a; color: #e6e8ec; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 18px; border-bottom: 1px solid #232733;
      display: flex; align-items: center; gap: 12px;
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #f0a23c; }
    header .dot.alive { background: #3ecf8e; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .ver { margin-left: auto; font-size: 12px; color: #8b90a0; }
    .bar {
      padding: 12px 18px; display: flex; gap: 8px; flex-wrap: wrap;
      border-bottom: 1px solid #232733; align-items: center;
    }
    button {
      background: #5b8cff; color: #fff; border: 0; border-radius: 6px;
      padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #2a2f3d; }
    button:hover { filter: brightness(1.08); }
    .hint { font-size: 12px; color: #8b90a0; margin-left: auto; }
    kbd {
      background: #2a2f3d; border: 1px solid #3a4150; border-radius: 4px;
      padding: 1px 6px; font-size: 11px;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 12px 18px; margin: 0;
      font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    #log .line { border-bottom: 1px solid #1b1e27; padding: 2px 0; }
    #log .line.err { color: #ff6b6b; }
    #log .line.ok { color: #3ecf8e; }
  </style>
</head>
<body>
  <header>
    <span class="dot alive" id="status"></span>
    <h1>Aim Coach</h1>
    <span class="ver electron-version"></span>
  </header>

  <div class="bar">
    <button id="createOSR">Crear overlay</button>
    <button id="toggleOSR" class="secondary">Mostrar/ocultar overlay</button>
    <button id="clearLog" class="secondary">Limpiar log</button>
    <span class="hint">En partida: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> para mostrar/ocultar</span>
  </div>

  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');

    function addLine(text) {
      const div = document.createElement('div');
      div.className = 'line'
        + (/error|err|threw|fail/i.test(text) ? ' err' : '')
        + (/\bok\b|registered|injected|ready|created/i.test(text) ? ' ok' : '');
      const ts = new Date().toLocaleTimeString();
      div.textContent = `[${ts}] ${text}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Logs del proceso main (overlay / coach / hotkeys) llegan por aca.
    window.gep.onMessage(function (...args) {
      addLine(args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' '));
    });

    document.getElementById('createOSR').addEventListener('click', async () => {
      try { await window.osr.openOSR(); } catch (e) { addLine('createOSR error ' + e); }
    });
    document.getElementById('toggleOSR').addEventListener('click', async () => {
      try { await window.osr.toggle(); } catch (e) { addLine('toggle error ' + e); }
    });
    document.getElementById('clearLog').addEventListener('click', () => {
      logEl.innerHTML = '';
    });

    window.app.initialize();
    addLine('UI lista. El overlay vive dentro del juego: abrí Valorant (Windowed/Borderless) como admin y se crea solo al inyectar. Esperá el "PKG ready: overlay".');
  </script>
</body>
</html>
